<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title>Hammer</title>
  <desc>Illustration of a hammer for the FixerUpper product catalogue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="32" fill="url(#bg)"/>
  <circle cx="140" cy="100" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="680" cy="400" r="150" fill="#ffffff" opacity="0.05"/>
  <rect x="255" y="140" width="220" height="86" rx="28" fill="#e2e8f0"/>
  <rect x="425" y="136" width="96" height="94" rx="24" fill="#94a3b8"/>
  <rect x="290" y="210" width="64" height="200" rx="28" transform="rotate(36 290 210)" fill="url(#accent)"/>
  <rect x="270" y="350" width="36" height="130" rx="18" transform="rotate(36 270 350)" fill="#7c2d12"/>
  <text x="400" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff">Hammer</text>
</svg>
